[project]
name = "nldisco"
version = "1.0.0"
description = "Neural latent discovery with sparse encoder-decoder models"
authors = [{ name = "Jai Bhagat", email = "jkbhagatio@gmail.com" }]
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE.md"]
requires-python = ">=3.9,<3.14"
dependencies = [
    "beartype>=0.18,<0.23",
    "datasets>=2.14.6",
    "einops",
    "email-validator",
    "huggingface-hub",
    "hydra-core>=1.3,<1.4",
    "ipython",
    "ipywidgets",
    "jax>=0.4.21",
    "jaxtyping",
    "matplotlib",
    "numpy",
    "openai",
    "pandas",
    "plotly>=5.23,<6",
    "python-dotenv>=1,<2",
    "rich",
    "scikit-learn",
    "scipy",
    "seaborn",
    "sortedcontainers",
    "submitit>=1.5,<2",
    "torch",
    "torcheval",
    "torchinfo",
    "torchvision",
    "tqdm",
    "typeguard",
    "wandb",
]

[project.optional-dependencies]
analysis = [
    "cebra>=0.6.1; python_version >= '3.10'",
    "cebra; python_version < '3.10'",
    "setuptools<81; python_version < '3.10'",
]
churchland = [
    "brainsets",
    "dandi",
    "h5py",
    "requests",
    "temporaldata",
]

[dependency-groups]
dev = [
    "ipdb",
    "ipykernel",
    "jupyter",
    "pyright",
    "pytest",
    "ruff",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE.md",
    "/pyproject.toml",
    "/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
extend-exclude = ["experiments/**/archive"]
line-length = 99
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = [
    "F722",  # Forward declarations used by jaxtyping.
    "E201",  # Whitespace after opening parenthesis.
    "E202",  # Whitespace before closing parenthesis.
    "E203",  # Whitespace before colon.
]

[tool.ruff.lint.isort]
known-third-party = ["wandb"]
